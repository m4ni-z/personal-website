<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0f17">
  <title>Tic Tac Toe</title>
  <style>
    @font-face {
      font-family: 'CustomFont';
      src: local('Tahoma'), url('font.woff') format('woff');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg: #0d0f17;
      --red: #ff2a5f;
      --blue: #00d2ff;
      --panel: rgba(255, 255, 255, 0.04);
      --line: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'CustomFont', Tahoma, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }

    html, body {
      height: 100%;
      overscroll-behavior: none;
      touch-action: manipulation;
    }

    body {
      background-color: var(--bg);
      color: #fff;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    .bg-aura {
      position: fixed;
      width: 350px;
      height: 350px;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.4;
      transition: opacity 0.8s ease;
      z-index: 0;
      pointer-events: none;
    }

    .aura-red { background: var(--red); top: 5%; right: -50px; }
    .aura-blue { background: var(--blue); bottom: 5%; left: -50px; }

    /* Coin screen */
    #coinScreen {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 50px;
      transition: opacity 0.5s ease;
    }

    .coin-wrapper {
      perspective: 1000px;
      -webkit-perspective: 1000px;
    }

    .coin {
      width: 100px;
      height: 100px;
      position: relative;
      -webkit-transform-style: preserve-3d;
      transform-style: preserve-3d;
      transition: transform 3s cubic-bezier(0.25, 1, 0.5, 1);
      -webkit-transition: -webkit-transform 3s cubic-bezier(0.25, 1, 0.5, 1);
      border-radius: 50%;
      cursor: pointer;
    }

    .coin-face {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border: 4px solid #fff;
    }

    .coin-red-face {
      background: linear-gradient(135deg, #ff2a5f, #8b0021);
      box-shadow: 0 0 25px var(--red);
    }

    .coin-blue-face {
      background: linear-gradient(135deg, #00d2ff, #005689);
      box-shadow: 0 0 25px var(--blue);
      -webkit-transform: rotateY(180deg);
      transform: rotateY(180deg);
    }

    .coin-controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    /* Game container */
    .container {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: min(92vw, 420px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease, transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .container.active {
      opacity: 1;
      pointer-events: auto;
    }

    .scoreboard {
      display: flex;
      justify-content: space-between;
      width: 100%;
      background: var(--panel);
      padding: 10px 24px;
      border-radius: 15px;
      border: 1px solid var(--line);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
    }

    .score-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-weight: bold;
    }

    .score-box.red { color: var(--red); text-shadow: 0 0 10px rgba(255, 42, 95, 0.5); }
    .score-box.blue { color: var(--blue); text-shadow: 0 0 10px rgba(0, 210, 255, 0.5); }

    .score-num {
      font-size: 1.6rem;
      margin-top: 2px;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-template-rows: repeat(3, minmax(0, 1fr));
      gap: 10px;
      width: min(100%, max(220px, calc(100vh - 270px)));
      width: min(100%, max(220px, calc(100dvh - 270px)));
      aspect-ratio: 1 / 1;
      background: rgba(255, 255, 255, 0.02);
      padding: 12px;
      border-radius: 20px;
      border: 1px solid var(--line);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
    }

    .cell {
      -webkit-appearance: none;
      appearance: none;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.05);
      color: #fff;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(2rem, 14vw, 3.4rem);
      font-weight: bold;
      line-height: 1;
      cursor: pointer;
      transition: background 0.2s ease, box-shadow 0.3s ease;
      min-width: 0;
      min-height: 0;
    }

    @media (hover: hover) {
      .cell:not(:disabled):hover { background: rgba(255, 255, 255, 0.1); }
      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(108, 92, 231, 0.6);
      }
    }

    .cell:focus-visible, .btn:focus-visible, .coin:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 2px;
    }

    .cell.red-symbol { color: var(--red); text-shadow: 0 0 15px var(--red); }
    .cell.blue-symbol { color: var(--blue); text-shadow: 0 0 15px var(--blue); }
    .cell.pop { animation: pop 0.25s ease; }
    .cell.win { background: rgba(255, 255, 255, 0.16); box-shadow: 0 0 18px rgba(255, 255, 255, 0.35); }

    @keyframes pop {
      from { transform: scale(0.5); opacity: 0.4; }
      to { transform: scale(1); opacity: 1; }
    }

    .btn {
      -webkit-appearance: none;
      appearance: none;
      padding: 12px 28px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      background: linear-gradient(135deg, #6c5ce7, #a29bfe);
      color: #fff;
      box-shadow: 0 4px 15px rgba(108, 92, 231, 0.4);
      transition: transform 0.3s ease, box-shadow 0.3s ease, opacity 0.3s ease;
    }

    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.5; cursor: default; }

    .btn.small {
      padding: 8px 16px;
      font-size: 0.85rem;
      background: rgba(255, 255, 255, 0.08);
      box-shadow: none;
      border: 1px solid var(--line);
    }

    .btn.danger { background: #e74c3c; box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4); }

    .msg {
      font-size: 1.2rem;
      font-weight: bold;
      min-height: 25px;
      text-align: center;
    }

    /* Modal */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      padding: calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));
      text-align: center;
      overflow-y: auto;
    }

    .modal.show { opacity: 1; pointer-events: auto; }

    .modal-content {
      background: #161925;
      padding: 28px 20px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 350px;
      width: 100%;
      margin: auto;
    }

    .player-result { transition: transform 0.3s ease; }
    .player-result.rotated { transform: rotate(180deg); }
    .player-result.hidden, .divider.hidden { display: none; }
    .divider { border: 0; border-top: 1px solid rgba(255, 255, 255, 0.1); }

    .modal h2 { font-size: 1.3rem; line-height: 1.5; }
    .modal-buttons { display: flex; gap: 10px; justify-content: center; margin-top: 6px; }

    @media (prefers-reduced-motion: reduce) {
      .coin { transition-duration: 0.6s; }
      .cell.pop { animation: none; }
    }
  </style>
</head>
<body>

  <div class="bg-aura aura-red" id="auraRed"></div>
  <div class="bg-aura aura-blue" id="auraBlue"></div>

  <!-- Coin flip screen -->
  <div id="coinScreen">
    <div class="coin-wrapper">
      <div class="coin" id="coin" role="button" tabindex="0" aria-label="Flip coin">
        <div class="coin-face coin-red-face"></div>
        <div class="coin-face coin-blue-face"></div>
      </div>
    </div>
    <div class="coin-controls">
      <button class="btn" id="flipBtn" type="button">Flip Coin</button>
      <div class="msg" id="coinMsg" aria-live="polite">Tap the coin to flip and start</div>
    </div>
  </div>

  <!-- Game -->
  <div class="container" id="gameContainer">
    <div class="scoreboard">
      <div class="score-box red">
        <span>RED</span>
        <span class="score-num" id="redScore">0</span>
      </div>
      <div class="score-box blue">
        <span>BLUE</span>
        <span class="score-num" id="blueScore">0</span>
      </div>
    </div>

    <div class="msg" id="turnMsg" aria-live="polite">Red's Turn</div>

    <div class="board" id="board" role="grid" aria-label="Tic Tac Toe board"></div>

    <button class="btn small" id="faceBtn" type="button">Face-to-face mode: Off</button>
  </div>

  <!-- End game modal -->
  <div class="modal" id="winModal" role="dialog" aria-modal="true">
    <div class="modal-content">
      <div class="player-result" id="redResultBox">
        <h2 id="winTextRed">...</h2>
      </div>
      <hr class="divider" id="divider">
      <div class="player-result" id="blueResultBox">
        <h2 id="winTextBlue">...</h2>
      </div>
      <div class="modal-buttons">
        <button class="btn danger" id="resetBtn" type="button">Reset</button>
        <button class="btn" id="continueBtn" type="button">Continue</button>
      </div>
    </div>
  </div>

  <script>
    var WIN_PATTERNS = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8],
      [0, 3, 6], [1, 4, 7], [2, 5, 8],
      [0, 4, 8], [2, 4, 6]
    ];

    var boardState = Array(9).fill('');
    var currentTurnColor = 'RED';
    var redSymbol = 'O';
    var blueSymbol = 'X';
    var winnerColor = null;
    var gameActive = false;
    var flipping = false;
    var redScore = 0;
    var blueScore = 0;

    var coin = document.getElementById('coin');
    var flipBtn = document.getElementById('flipBtn');
    var coinMsg = document.getElementById('coinMsg');
    var coinScreen = document.getElementById('coinScreen');
    var gameContainer = document.getElementById('gameContainer');
    var turnMsg = document.getElementById('turnMsg');
    var auraRed = document.getElementById('auraRed');
    var auraBlue = document.getElementById('auraBlue');
    var boardEl = document.getElementById('board');
    var redScoreEl = document.getElementById('redScore');
    var blueScoreEl = document.getElementById('blueScore');
    var redResultBox = document.getElementById('redResultBox');
    var blueResultBox = document.getElementById('blueResultBox');
    var divider = document.getElementById('divider');
    var winModal = document.getElementById('winModal');
    var winTextRed = document.getElementById('winTextRed');
    var winTextBlue = document.getElementById('winTextBlue');
    var faceBtn = document.getElementById('faceBtn');

    // Face-to-face mode: the board turns toward the player whose turn it is
    var faceToFace = false;
    try {
      var saved = localStorage.getItem('ttt-face-to-face');
      if (saved !== null) {
        faceToFace = saved === '1';
      } else {
        faceToFace = window.matchMedia('(pointer: coarse) and (max-width: 768px)').matches;
      }
    } catch (e) {
      faceToFace = window.matchMedia('(pointer: coarse) and (max-width: 768px)').matches;
    }

    // Build the board cells
    var cells = [];
    for (var i = 0; i < 9; i++) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'cell';
      btn.setAttribute('role', 'gridcell');
      btn.setAttribute('aria-label', 'Cell ' + (i + 1) + ', empty');
      btn.dataset.index = i;
      btn.addEventListener('click', onCellClick);
      boardEl.appendChild(btn);
      cells.push(btn);
    }

    function onCellClick(e) {
      makeMove(parseInt(e.currentTarget.dataset.index, 10));
    }

    function buzz(ms) {
      if (navigator.vibrate) navigator.vibrate(ms);
    }

    function updateFaceBtn() {
      faceBtn.textContent = 'Face-to-face mode: ' + (faceToFace ? 'On' : 'Off');
    }

    faceBtn.addEventListener('click', function () {
      faceToFace = !faceToFace;
      try { localStorage.setItem('ttt-face-to-face', faceToFace ? '1' : '0'); } catch (e) {}
      updateFaceBtn();
      updateTurnUI();
    });

    function setStarter(color) {
      currentTurnColor = color;
      if (color === 'RED') {
        redSymbol = 'O';
        blueSymbol = 'X';
      } else {
        blueSymbol = 'O';
        redSymbol = 'X';
      }
    }

    function flipCoin() {
      if (flipping) return;
      flipping = true;
      flipBtn.disabled = true;
      coinMsg.textContent = 'Flipping...';

      var isRedStarter = Math.random() < 0.5;
      setStarter(isRedStarter ? 'RED' : 'BLUE');

      var degrees = isRedStarter ? 1800 : 1980;
      coin.style.transform = 'rotateY(' + degrees + 'deg)';

      setTimeout(function () {
        coinScreen.style.opacity = '0';
        setTimeout(function () {
          coinScreen.style.display = 'none';
          gameContainer.classList.add('active');
          gameActive = true;
          flipping = false;
          updateTurnUI();
        }, 500);
      }, 3000);
    }

    flipBtn.addEventListener('click', flipCoin);
    coin.addEventListener('click', flipCoin);
    coin.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        flipCoin();
      }
    });

    function updateTurnUI() {
      var isRed = currentTurnColor === 'RED';
      turnMsg.textContent = isRed ? "Red's Turn" : "Blue's Turn";
      turnMsg.style.color = isRed ? '#ff2a5f' : '#00d2ff';
      auraRed.style.opacity = isRed ? '0.7' : '0.2';
      auraBlue.style.opacity = isRed ? '0.2' : '0.7';
      gameContainer.style.transform = (faceToFace && isRed && gameActive) ? 'rotate(180deg)' : 'rotate(0deg)';
    }

    function makeMove(index) {
      if (!gameActive || boardState[index] !== '') return;

      var isRed = currentTurnColor === 'RED';
      var symbol = isRed ? redSymbol : blueSymbol;

      boardState[index] = symbol;
      var cell = cells[index];
      cell.textContent = symbol;
      cell.classList.add(isRed ? 'red-symbol' : 'blue-symbol', 'pop');
      cell.setAttribute('aria-label', 'Cell ' + (index + 1) + ', ' + symbol);
      buzz(15);

      var line = findWinLine();
      if (line) {
        winnerColor = currentTurnColor;
        if (isRed) redScore++; else blueScore++;
        redScoreEl.textContent = redScore;
        blueScoreEl.textContent = blueScore;
        line.forEach(function (i) { cells[i].classList.add('win'); });
        buzz([40, 40, 80]);
        endGame(false);
      } else if (boardState.every(function (c) { return c !== ''; })) {
        winnerColor = null;
        endGame(true);
      } else {
        currentTurnColor = isRed ? 'BLUE' : 'RED';
        updateTurnUI();
      }
    }

    function findWinLine() {
      for (var i = 0; i < WIN_PATTERNS.length; i++) {
        var p = WIN_PATTERNS[i];
        var a = boardState[p[0]];
        if (a && a === boardState[p[1]] && a === boardState[p[2]]) return p;
      }
      return null;
    }

    function endGame(isDraw) {
      gameActive = false;
      gameContainer.style.transform = 'rotate(0deg)';

      setTimeout(function () {
        redResultBox.classList.remove('rotated', 'hidden');
        blueResultBox.classList.remove('hidden');
        divider.classList.remove('hidden');

        if (faceToFace) {
          // Each player reads the result from their own side
          redResultBox.classList.add('rotated');

          if (isDraw) {
            winTextRed.textContent = "It's a Draw! 🤝";
            winTextBlue.textContent = "It's a Draw! 🤝";
            winTextRed.style.color = '#fff';
            winTextBlue.style.color = '#fff';
          } else if (winnerColor === 'RED') {
            winTextRed.innerHTML = '🎉 Red Player:<br><span style="color:#ff2a5f;">You Won!</span>';
            winTextBlue.innerHTML = '😢 Blue Player:<br><span style="color:#00d2ff;">You Lost!</span>';
            winTextRed.style.color = winTextBlue.style.color = '#fff';
          } else {
            winTextBlue.innerHTML = '🎉 Blue Player:<br><span style="color:#00d2ff;">You Won!</span>';
            winTextRed.innerHTML = '😢 Red Player:<br><span style="color:#ff2a5f;">You Lost!</span>';
            winTextRed.style.color = winTextBlue.style.color = '#fff';
          }
        } else {
          // Single shared screen: show one message only
          redResultBox.classList.add('hidden');
          divider.classList.add('hidden');

          if (isDraw) {
            winTextBlue.textContent = "It's a Draw! 🤝";
            winTextBlue.style.color = '#fff';
          } else {
            var name = winnerColor === 'RED' ? 'Red Player' : 'Blue Player';
            winTextBlue.textContent = '🎉 ' + name + ' Won!';
            winTextBlue.style.color = winnerColor === 'RED' ? '#ff2a5f' : '#00d2ff';
          }
        }

        winModal.classList.add('show');
      }, 700);
    }

    function clearBoard() {
      boardState = Array(9).fill('');
      cells.forEach(function (cell, i) {
        cell.textContent = '';
        cell.className = 'cell';
        cell.setAttribute('aria-label', 'Cell ' + (i + 1) + ', empty');
      });
    }

    function continueGame() {
      winModal.classList.remove('show');
      clearBoard();

      if (winnerColor) {
        // The winner starts the next round
        setStarter(winnerColor);
      } else {
        // After a draw, the player who did not make the last move starts
        setStarter(currentTurnColor === 'RED' ? 'BLUE' : 'RED');
      }

      winnerColor = null;
      gameActive = true;
      updateTurnUI();
    }

    function fullReset() {
      winModal.classList.remove('show');
      clearBoard();

      redScore = 0;
      blueScore = 0;
      redScoreEl.textContent = 0;
      blueScoreEl.textContent = 0;
      winnerColor = null;
      gameActive = false;
      flipping = false;

      gameContainer.classList.remove('active');
      gameContainer.style.transform = 'rotate(0deg)';
      coinScreen.style.display = 'flex';
      setTimeout(function () { coinScreen.style.opacity = '1'; }, 50);
      flipBtn.disabled = false;
      coin.style.transform = 'rotateY(0deg)';
      coinMsg.textContent = 'Tap the coin to flip and start';
      auraRed.style.opacity = '0.4';
      auraBlue.style.opacity = '0.4';
    }

    document.getElementById('continueBtn').addEventListener('click', continueGame);
    document.getElementById('resetBtn').addEventListener('click', fullReset);

    updateFaceBtn();
  </script>
</body>
</html>
