<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mani Zamzami</title>

  <!-- Favicon -->

  <link rel="icon" type="image/png" href="assets/images/logo.png" />

  <style>
    /* -----------------------------------------------------------
       Design tokens
    ----------------------------------------------------------- */
    :root {
      --c-black: #000000;
      --c-abyss: #020617;
      --c-navy: #061B4F;
      --c-royal: #0A3D91;
      --c-blue: #008CFF;
      --c-cyan: #00C8FF;
      --c-violet: #5B4DFF;

      --text-primary: rgba(255, 255, 255, 0.94);
      --text-secondary: rgba(255, 255, 255, 0.5);

      --glass-bg: rgba(8, 14, 30, 0.38);
      --glass-border: rgba(180, 205, 255, 0.14);

      --sidebar-width: 248px;
      --sidebar-rail: 64px;

      --ease-glass: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      background-color: var(--c-black);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter",
        "Helvetica Neue", Arial, sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* -----------------------------------------------------------
       Ambient animated background
    ----------------------------------------------------------- */
    .ambient-background {
      position: fixed;
      inset: 0;
      z-index: -1;
      background: linear-gradient(160deg, var(--c-black) 0%, var(--c-abyss) 45%, #010208 100%);
      overflow: hidden;
    }

    .ambient-background::before,
    .ambient-background::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      will-change: transform;
    }

    .ambient-background::before {
      width: 60vw;
      height: 60vw;
      top: -15vw;
      left: -10vw;
      background: radial-gradient(circle at 50% 50%, rgba(0, 140, 255, 0.35), rgba(0, 140, 255, 0) 70%);
      animation: driftOne 42s ease-in-out infinite;
    }

    .ambient-background::after {
      width: 55vw;
      height: 55vw;
      bottom: -20vw;
      right: -10vw;
      background: radial-gradient(circle at 50% 50%, rgba(0, 200, 255, 0.28), rgba(0, 200, 255, 0) 70%);
      animation: driftTwo 50s ease-in-out infinite;
    }

    .glow-layer {
      position: absolute;
      border-radius: 50%;
      filter: blur(110px);
      will-change: transform;
    }

    .glow-layer.navy {
      width: 45vw;
      height: 45vw;
      top: 30%;
      left: 35%;
      background: radial-gradient(circle at 50% 50%, rgba(10, 61, 145, 0.45), rgba(10, 61, 145, 0) 70%);
      animation: driftThree 60s ease-in-out infinite;
    }

    .glow-layer.violet {
      width: 38vw;
      height: 38vw;
      top: 5%;
      right: 5%;
      background: radial-gradient(circle at 50% 50%, rgba(91, 77, 255, 0.18), rgba(91, 77, 255, 0) 70%);
      animation: driftFour 70s ease-in-out infinite;
    }

    @keyframes driftOne {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(8vw, 6vh) scale(1.08); }
    }

    @keyframes driftTwo {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-7vw, -5vh) scale(1.06); }
    }

    @keyframes driftThree {
      0%, 100% { transform: translate(-4vw, 0) scale(1); }
      50% { transform: translate(5vw, 4vh) scale(1.1); }
    }

    @keyframes driftFour {
      0%, 100% { transform: translate(0, -3vh) scale(1); }
      50% { transform: translate(-6vw, 5vh) scale(0.95); }
    }

    @media (prefers-reduced-motion: reduce) {
      .ambient-background::before,
      .ambient-background::after,
      .glow-layer {
        animation: none;
      }
    }

    /* -----------------------------------------------------------
       App shell
    ----------------------------------------------------------- */
    .app-shell {
      display: flex;
      height: 100vh;
      width: 100%;
      overflow: hidden;
    }

    /* =============================================================
       DESKTOP / LAPTOP / TABLET SIDEBAR  (>= 681px)
    ============================================================= */
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      width: var(--sidebar-width);
      z-index: 20;
      pointer-events: none;
    }

    .sidebar-surface {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 0;
      bottom: 12px;
      border-radius: 22px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(28px) saturate(160%);
      -webkit-backdrop-filter: blur(28px) saturate(160%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        inset 0 0 40px rgba(0, 140, 255, 0.05),
        0 18px 40px rgba(0, 0, 0, 0.45);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      pointer-events: auto;
      transition: transform 0.6s var(--ease-glass), opacity 0.5s ease;
    }

    .sidebar-surface::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.10) 0%,
        rgba(255, 255, 255, 0.02) 18%,
        rgba(255, 255, 255, 0) 40%
      );
      pointer-events: none;
    }

    .sidebar-surface::after {
      content: "";
      position: absolute;
      inset: -40%;
      background: radial-gradient(circle at 30% 20%, rgba(0, 200, 255, 0.16), transparent 55%),
        radial-gradient(circle at 80% 85%, rgba(91, 77, 255, 0.12), transparent 55%);
      filter: blur(20px);
      pointer-events: none;
      opacity: 0.9;
    }

    /* Sidebar logo, top of the panel */
    .sidebar-brand {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 12px 4px 12px;
      flex-shrink: 0;
    }

    .sidebar-brand img {
      max-width: 58%;
      height: auto;
      display: block;
      filter: drop-shadow(0 6px 18px rgba(0, 140, 255, 0.25));
    }

    .sidebar-nav {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 18px 12px 22px 12px;
      overflow: hidden;
    }

    .nav-link {
      position: relative;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 14px;
      border-radius: 14px;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 14.5px;
      font-weight: 500;
      letter-spacing: 0.01em;
      white-space: nowrap;
      border: 1px solid transparent;
      transition: background-color 0.3s ease, color 0.3s ease,
        border-color 0.3s ease, box-shadow 0.3s ease;
      min-height: 44px;
    }

    button.nav-link {
      width: 100%;
      background: none;
      font: inherit;
      cursor: pointer;
      justify-content: space-between;
    }

    .nav-link .icon {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-link .icon svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.35s var(--ease-glass);
    }

    .nav-link .label {
      flex: 1;
      text-align: left;
    }

    .nav-link:hover {
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(180, 205, 255, 0.14);
    }

    .nav-link:hover .icon svg {
      transform: translateX(1px);
    }

    .nav-link:focus-visible {
      outline: 2px solid rgba(0, 200, 255, 0.6);
      outline-offset: 2px;
    }

    .nav-link.active {
      color: var(--text-primary);
      background: linear-gradient(135deg, rgba(0, 140, 255, 0.16), rgba(0, 200, 255, 0.06));
      border-color: rgba(0, 200, 255, 0.28);
      box-shadow: 0 0 22px rgba(0, 140, 255, 0.18);
    }

    .nav-group {
      display: flex;
      flex-direction: column;
    }

    .nav-chevron {
      flex-shrink: 0;
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-chevron svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.35s var(--ease-glass);
    }

    .nav-toggle[aria-expanded="true"] .nav-chevron svg {
      transform: rotate(90deg);
    }

    .nav-submenu {
      max-height: 0;
      overflow: hidden;
      padding-left: 34px;
      transition: max-height 0.4s var(--ease-glass), padding 0.4s var(--ease-glass);
    }

    .nav-submenu.open {
      max-height: 160px;
      padding-top: 4px;
      padding-bottom: 4px;
    }

    /* Tools submenu items: same nav-link look, slightly smaller
       to read as children of "Tools" rather than top-level items. */
    .nav-sublink {
      gap: 10px;
      padding: 9px 12px;
      min-height: 38px;
      font-size: 13.5px;
      font-weight: 450;
    }

    .nav-sublink .icon,
    .nav-sublink .icon svg {
      width: 16px;
      height: 16px;
    }

    .sidebar-toggle {
      position: absolute;
      bottom: 14px;
      left: 12px;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: 1px solid var(--glass-border);
      background: rgba(10, 16, 34, 0.55);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      color: var(--text-secondary);
      cursor: pointer;
      z-index: 2;
      pointer-events: auto;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.4);
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .sidebar-toggle:hover {
      color: var(--text-primary);
      background: rgba(10, 16, 34, 0.75);
    }

    .sidebar-toggle:focus-visible {
      outline: 2px solid rgba(0, 200, 255, 0.6);
      outline-offset: 2px;
    }

    .sidebar-toggle svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.5s var(--ease-glass);
    }

    .sidebar.collapsed .sidebar-surface {
      transform: translateX(-120%);
      opacity: 0;
      pointer-events: none;
    }

    .sidebar.collapsed .sidebar-toggle svg {
      transform: rotate(180deg);
    }

    .main-content {
      flex: 1;
      margin-left: var(--sidebar-width);
      height: 100vh;
      overflow-y: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      transition: margin-left 0.6s var(--ease-glass);
    }

    .sidebar.collapsed ~ .main-content {
      margin-left: var(--sidebar-rail);
    }

    .welcome {
      font-size: clamp(2.4rem, 6vw, 4.6rem);
      font-weight: 300;
      letter-spacing: 0.01em;
      color: var(--text-primary);
      text-align: center;
      text-shadow: 0 0 60px rgba(0, 160, 255, 0.25);
      user-select: none;
    }

    /* =============================================================
       MOBILE LIQUID GLASS MENU  (<= 680px)
    ============================================================= */
    .mobile-menu-btn,
    .mobile-overlay,
    .mobile-drawer {
      display: none;
    }

    @media (max-width: 680px) {
      .sidebar {
        display: none;
      }

      .main-content {
        margin-left: 0;
      }

      .sidebar.collapsed ~ .main-content {
        margin-left: 0;
      }

      .mobile-menu-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        position: fixed;
        top: max(14px, env(safe-area-inset-top));
        left: 14px;
        width: 46px;
        height: 46px;
        border-radius: 16px;
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        backdrop-filter: blur(24px) saturate(160%);
        -webkit-backdrop-filter: blur(24px) saturate(160%);
        box-shadow: 0 10px 26px rgba(0, 0, 0, 0.4);
        color: var(--text-primary);
        z-index: 40;
        cursor: pointer;
      }

      .mobile-menu-btn svg {
        width: 20px;
        height: 20px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
      }

      .mobile-menu-btn:focus-visible {
        outline: 2px solid rgba(0, 200, 255, 0.6);
        outline-offset: 2px;
      }

      .mobile-overlay {
        display: block;
        position: fixed;
        inset: 0;
        background: rgba(0, 4, 12, 0.5);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.4s ease;
        z-index: 45;
      }

      .mobile-overlay.open {
        opacity: 1;
        pointer-events: auto;
      }

      .mobile-drawer {
        display: block;
        position: fixed;
        top: 0;
        left: 0;
        height: 100vh;
        width: min(78vw, 300px);
        max-width: 300px;
        z-index: 50;
        transform: translateX(-105%);
        transition: transform 0.5s var(--ease-glass);
      }

      .mobile-drawer.open {
        transform: translateX(0);
      }

      .mobile-drawer-surface {
        position: relative;
        height: 100%;
        margin: 12px 0 12px 12px;
        border-radius: 22px;
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        backdrop-filter: blur(28px) saturate(160%);
        -webkit-backdrop-filter: blur(28px) saturate(160%);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.08),
          inset 0 0 40px rgba(0, 140, 255, 0.05),
          0 18px 40px rgba(0, 0, 0, 0.45);
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        padding: 18px 14px;
      }

      .mobile-drawer-surface::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.10) 0%, rgba(255, 255, 255, 0.02) 18%, rgba(255, 255, 255, 0) 40%);
        pointer-events: none;
      }

      .mobile-drawer-surface::after {
        content: "";
        position: absolute;
        inset: -40%;
        background: radial-gradient(circle at 30% 20%, rgba(0, 200, 255, 0.16), transparent 55%),
          radial-gradient(circle at 80% 85%, rgba(91, 77, 255, 0.12), transparent 55%);
        filter: blur(20px);
        pointer-events: none;
        opacity: 0.9;
      }

      .mobile-drawer-header {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 10px;
      }

      .mobile-drawer-header img {
        max-height: 30px;
        width: auto;
        display: block;
        filter: drop-shadow(0 6px 18px rgba(0, 140, 255, 0.25));
      }

      .mobile-drawer-close {
        position: relative;
        flex-shrink: 0;
        width: 38px;
        height: 38px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        border: 1px solid var(--glass-border);
        background: rgba(255, 255, 255, 0.04);
        color: var(--text-secondary);
        cursor: pointer;
      }

      .mobile-drawer-close svg {
        width: 16px;
        height: 16px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
      }

      .mobile-drawer-close:hover {
        color: var(--text-primary);
        background: rgba(255, 255, 255, 0.08);
      }

      .mobile-drawer-close:focus-visible {
        outline: 2px solid rgba(0, 200, 255, 0.6);
        outline-offset: 2px;
      }

      .mobile-drawer-nav {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .mobile-drawer .nav-link {
        min-height: 48px;
      }

      .mobile-drawer .nav-sublink {
        min-height: 42px;
      }
    }

    @media (max-width: 360px) {
      .welcome {
        font-size: clamp(2rem, 9vw, 2.6rem);
      }
    }
  </style>

</head>

    <div class="glow-layer violet"></div>

  <div class="app-shell">

      <a class="nav-link" href="contact-me/">

    </nav>
  </div>

  <button
    type="button"
    class="sidebar-toggle"
    id="sidebarToggle"
    aria-label="Collapse sidebar"
    aria-expanded="true"
    aria-controls="sidebar"
  >
    <svg viewBox="0 0 24 24">
      <path d="M15 5 8 12l7 7" />
    </svg>
  </button>
</aside>

<button
  type="button"
  class="mobile-menu-btn"
  id="mobileMenuBtn"
  aria-label="Open menu"
  aria-expanded="false"
  aria-controls="mobileDrawer"
>
  <svg viewBox="0 0 24 24">
    <path d="M4 7h16M4 12h16M4 17h16" />
  </svg>
</button>

<div class="mobile-overlay" id="mobileOverlay"></div>

<aside
  class="mobile-drawer"
  id="mobileDrawer"
  aria-label="Mobile navigation"
  aria-hidden="true"
>
  <div class="mobile-drawer-surface">

    <div class="mobile-drawer-header">
      <img src="assets/images/logo.png" alt="Logo" />

      <button
        type="button"
        class="mobile-drawer-close"
        id="mobileDrawerClose"
        aria-label="Close menu"
      >
        <svg viewBox="0 0 24 24">
          <path d="m6 6 12 12M18 6 6 18" />
        </svg>
      </button>
    </div>

    <nav class="mobile-drawer-nav" aria-label="Primary navigation">

      <a class="nav-link active" href="/" aria-current="page">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M4 11.5 12 4l8 7.5" />
            <path d="M6 10v9a1 1 0 0 0 1 1h3v-5h4v5h3a1 1 0 0 0 1-1v-9" />
          </svg>
        </span>
        <span class="label">Home</span>
      </a>

      <a class="nav-link" href="projects/">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">

  <script>
    // Desktop sidebar collapse / expand
    (function () {
      var sidebar = document.getElementById('sidebar');
      var toggle = document.getElementById('sidebarToggle');

      toggle.addEventListener('click', function () {
        var isCollapsed = sidebar.classList.toggle('collapsed');
        toggle.setAttribute('aria-expanded', String(!isCollapsed));
        toggle.setAttribute(
          'aria-label',
          isCollapsed ? 'Expand sidebar' : 'Collapse sidebar'
        );
      });
    })();

    // Mobile menu drawer
    (function () {
      var menuBtn = document.getElementById('mobileMenuBtn');
      var closeBtn = document.getElementById('mobileDrawerClose');
      var overlay = document.getElementById('mobileOverlay');
      var drawer = document.getElementById('mobileDrawer');

      function openDrawer() {
        drawer.classList.add('open');
        overlay.classList.add('open');
        drawer.setAttribute('aria-hidden', 'false');
        menuBtn.setAttribute('aria-expanded', 'true');
      }

      function closeDrawer() {
        drawer.classList.remove('open');
        overlay.classList.remove('open');
        drawer.setAttribute('aria-hidden', 'true');
        menuBtn.setAttribute('aria-expanded', 'false');
      }

      menuBtn.addEventListener('click', openDrawer);
      closeBtn.addEventListener('click', closeDrawer);
      overlay.addEventListener('click', closeDrawer);

      drawer.querySelectorAll('.nav-link').forEach(function (link) {
        link.addEventListener('click', function () {
          // Keep the mobile drawer open when Tools is expanded.
          if (link.classList.contains('nav-toggle')) {
            return;
          }

          // Close the drawer when a navigation item is selected.
          closeDrawer();
        });
      });

      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && drawer.classList.contains('open')) {
          closeDrawer();
        }
      });
    })();

    // Tools expandable submenu (desktop + mobile, independent of each other)
    (function () {
      function initToolsToggle(toggleId, submenuId) {
        var toggle = document.getElementById(toggleId);
        var submenu = document.getElementById(submenuId);

        if (!toggle || !submenu) return;

        toggle.addEventListener('click', function () {
          var isOpen = submenu.classList.toggle('open');
          toggle.setAttribute('aria-expanded', String(isOpen));
        });
      }

      initToolsToggle('toolsToggleDesktop', 'toolsSubmenuDesktop');
      initToolsToggle('toolsToggleMobile', 'toolsSubmenuMobile');
    })();
  </script>
